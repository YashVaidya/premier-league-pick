<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>PremierLeaguePick status</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 24px auto; padding: 0 16px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border-bottom: 1px solid #ddd; text-align: left; padding: 8px; }
  </style>
</head>
<body>
  <h1>Production monitoring</h1>
  <p><a href="/">back</a></p>
  {% if metrics %}
  <table>
    <tr><th>Metric</th><th>Value</th><th>Updated</th></tr>
    {% for m in metrics %}
    <tr>
      <td>{{ m.name }}</td>
      <td>{{ m.value }}</td>
      <td>{{ m.updated_at }}</td>
    </tr>
    {% endfor %}
  </table>
  {% else %}
    <p>No metrics yet. Hit the site or run collector/analyzer.</p>
  {% endif %}
</body>
</html>
